<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>All Roads Lead to You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7E7A8;
  --bg-alt:#F2E093;
  --bg-deep:#EAD474;
  --text:#171717;
  --text-soft:#4A4636;
  --card:#FFFDF5;
  --card-line:rgba(23,23,23,0.14);
  --accent:#20309B;
  --accent-2:#141F6E;
  --red:#A8391A;
  --white:#FFFFFF;
  --radius-s:3px;
  --radius-m:6px;
  --maxw:1180px;
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Bricolage Grotesque',sans-serif;
  font-weight:700;
  margin:0;
  letter-spacing:-0.01em;
  line-height:1.05;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
p{margin:0;}
img{max-width:100%;display:block;}
.container{max-width:var(--maxw);margin:0 auto;padding:0 28px;}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 24px;font-size:15px;font-weight:600;border-radius:var(--radius-s);
  border:1.5px solid transparent;transition:transform .15s ease, background .15s ease, border-color .15s ease;
  white-space:nowrap;
}
.btn-primary{background:var(--accent);color:var(--white);}
.btn-primary:hover{background:var(--accent-2);transform:translateY(-1px);}
.btn-secondary{background:transparent;color:var(--text);border-color:var(--text);}
.btn-secondary:hover{background:var(--text);color:var(--bg);}
.btn-ghost{background:transparent;color:var(--accent);border-color:transparent;padding:13px 10px;}
.btn-ghost:hover{text-decoration:underline;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

/* ---------- Nav ---------- */
.nav{
  position:sticky;top:0;z-index:50;
  background:var(--bg);
  border-bottom:1.5px solid var(--card-line);
}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;max-width:var(--maxw);margin:0 auto;}
.brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:17px;letter-spacing:-0.01em;display:flex;align-items:center;gap:9px;}
.brand-mark{width:22px;height:22px;flex:none;}
.nav-links{display:flex;align-items:center;gap:30px;}
.nav-links a{font-size:14.5px;font-weight:500;color:var(--text-soft);}
.nav-links a:hover,.nav-links a.active{color:var(--text);}
.nav-right{display:flex;align-items:center;gap:14px;}
.nav-burger{display:none;background:none;border:none;font-size:22px;line-height:1;padding:4px;}
.nav-user{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;cursor:pointer;}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex:none;}
.mobile-menu{display:none;flex-direction:column;padding:6px 28px 20px;gap:14px;border-bottom:1.5px solid var(--card-line);background:var(--bg);}
.mobile-menu a,.mobile-menu button{font-size:15px;font-weight:600;text-align:left;background:none;border:none;padding:6px 0;color:var(--text);}
.mobile-menu.open{display:flex;}
@media(max-width:840px){
  .nav-links{display:none;}
  .nav-burger{display:block;}
  .nav-right .btn-secondary{display:none;}
}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;padding:76px 0 60px;}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;}
.eyebrow-line{display:flex;align-items:center;gap:10px;margin-bottom:22px;color:var(--text-soft);font-size:13.5px;font-weight:600;}
.eyebrow-line svg{flex:none;}
.hero h1{font-size:clamp(34px,4.6vw,58px);max-width:640px;}
.hero-sub{margin-top:20px;font-size:18px;color:var(--text-soft);max-width:470px;}
.hero-ctas{margin-top:32px;display:flex;gap:14px;flex-wrap:wrap;}
.hero-art{position:relative;min-height:360px;}
.hero-art svg{width:100%;height:100%;}
.path-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;opacity:.55;}
.path-line.thin{stroke-width:1.3;opacity:.35;}
.path-node{fill:var(--accent);}
.path-node.hub{fill:var(--text);}
@media(prefers-reduced-motion:no-preference){
  .draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2.1s cubic-bezier(.4,0,.2,1) forwards;}
  .draw.d1{animation-delay:.1s;}
  .draw.d2{animation-delay:.35s;}
  .draw.d3{animation-delay:.15s;}
  .draw.d4{animation-delay:.5s;}
  .draw.d5{animation-delay:.25s;}
  .pop{opacity:0;transform:scale(.4);transform-origin:center;animation:pop .5s ease forwards;}
  .pop.p1{animation-delay:1.9s;}
  .pop.p2{animation-delay:2.05s;}
  .pop.p3{animation-delay:2.2s;}
}
@keyframes draw{to{stroke-dashoffset:0;}}
@keyframes pop{to{opacity:1;transform:scale(1);}}
@media(max-width:900px){
  .hero-grid{grid-template-columns:1fr;}
  .hero-art{min-height:260px;order:-1;}
}

/* ---------- Sections ---------- */
.section{padding:78px 0;}
.section-alt{background:var(--bg-alt);}
.section-head{max-width:640px;margin-bottom:44px;}
.section-head h2{font-size:clamp(26px,3.2vw,38px);}
.section-head p{margin-top:14px;font-size:16.5px;color:var(--text-soft);}

/* ---------- Problem section ---------- */
.problem-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;}
.problem-col h3{font-size:15px;text-transform:none;color:var(--accent-2);margin-bottom:14px;font-weight:700;}
.problem-col ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;}
.problem-col li{position:relative;padding-left:20px;font-size:15.5px;color:var(--text-soft);}
.problem-col li::before{content:"";position:absolute;left:0;top:8px;width:7px;height:1.5px;background:var(--text-soft);}
.problem-close{margin-top:44px;padding-top:34px;border-top:1.5px solid var(--card-line);font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:22px;max-width:680px;}
@media(max-width:760px){.problem-grid{grid-template-columns:1fr;gap:36px;}}

/* ---------- How it works ---------- */
.steps{position:relative;}
.steps-row{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;position:relative;}
.step{background:var(--card);border:1.5px solid var(--card-line);border-radius:var(--radius-m);padding:26px 22px;position:relative;}
.step-num{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:13px;color:var(--accent);margin-bottom:16px;}
.step h4{font-size:18px;margin-bottom:8px;}
.step p{font-size:14.5px;color:var(--text-soft);}
.steps-flow{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:18px;font-size:13px;font-weight:600;color:var(--text-soft);flex-wrap:wrap;}
.steps-flow span.arrow{color:var(--accent);}
@media(max-width:860px){.steps-row{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.steps-row{grid-template-columns:1fr;}}

/* ---------- Project cards ---------- */
.projects-toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:30px;padding:18px;background:var(--card);border:1.5px solid var(--card-line);border-radius:var(--radius-m);}
.projects-toolbar select,.projects-toolbar input[type=text]{
  border:1.5px solid var(--card-line);background:var(--white);border-radius:var(--radius-s);
  padding:10px 12px;font-size:14px;font-family:inherit;color:var(--text);min-width:150px;
}
.projects-toolbar input[type=text]{flex:1;min-width:200px;}
.results-count{font-size:13.5px;color:var(--text-soft);margin-bottom:18px;}
.project-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media(max-width:960px){.project-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:640px){.project-grid{grid-template-columns:1fr;}}
.pcard{
  background:var(--card);border:1.5px solid var(--card-line);border-radius:var(--radius-m);
  padding:22px;display:flex;flex-direction:column;gap:12px;transition:transform .18s ease, box-shadow .18s ease;
  cursor:pointer;
}
.pcard:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(23,23,23,0.10);}
.pcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.pcard-cat{font-size:12px;font-weight:700;color:var(--accent);}
.status-pill{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap;}
.status-Recruiting{background:#E4EDFF;color:var(--accent-2);}
.status-Building{background:#FCE7DC;color:var(--red);}
.status-Completed{background:#E4F5E1;color:#22622A;}
.pcard h3{font-size:19px;}
.pcard-desc{font-size:14.5px;color:var(--text-soft);flex:1;}
.pcard-skills{font-size:13px;color:var(--text-soft);font-weight:500;}
.pcard-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--text-soft);border-top:1px solid var(--card-line);padding-top:12px;margin-top:2px;}
.pcard-meta b{color:var(--text);font-weight:600;}
.pcard-foot{display:flex;justify-content:space-between;align-items:center;margin-top:2px;}
.pcard-foot .link{font-size:13.5px;font-weight:700;color:var(--accent);}

/* ---------- Empty state ---------- */
.empty-state{text-align:center;padding:70px 20px;border:1.5px dashed var(--card-line);border-radius:var(--radius-m);background:var(--card);}
.empty-state h3{font-size:24px;margin-bottom:10px;}
.empty-state p{color:var(--text-soft);margin-bottom:22px;font-size:15px;}

/* ---------- Detail page ---------- */
.detail-header{padding:52px 0 34px;border-bottom:1.5px solid var(--card-line);}
.detail-crumb{font-size:13px;color:var(--text-soft);margin-bottom:16px;}
.detail-crumb a{color:var(--accent);font-weight:600;}
.detail-header h1{font-size:clamp(28px,4vw,42px);max-width:760px;}
.detail-header .pcard-desc{font-size:17px;margin-top:14px;max-width:680px;}
.detail-header-row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-top:26px;}
.detail-by{font-size:14px;color:var(--text-soft);}
.detail-by b{color:var(--text);}
.detail-layout{display:grid;grid-template-columns:1.5fr 1fr;gap:56px;padding:48px 0 80px;align-items:start;}
.detail-main section{margin-bottom:44px;}
.detail-main h2{font-size:22px;margin-bottom:14px;}
.detail-main p{color:var(--text-soft);font-size:15.5px;white-space:pre-line;}
.role-list{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.role-card{border:1.5px solid var(--card-line);background:var(--card);border-radius:var(--radius-s);padding:16px;}
.role-card h4{font-size:15.5px;margin-bottom:5px;}
.role-card span{font-size:13px;color:var(--text-soft);}
@media(max-width:560px){.role-list{grid-template-columns:1fr;}}
.timeline{display:flex;align-items:center;gap:0;margin-top:6px;}
.tl-step{flex:1;text-align:center;position:relative;}
.tl-dot{width:14px;height:14px;border-radius:50%;background:var(--card-line);margin:0 auto 8px;border:2px solid var(--card-line);}
.tl-step.active .tl-dot{background:var(--accent);border-color:var(--accent);}
.tl-step.done .tl-dot{background:var(--text);border-color:var(--text);}
.tl-line{position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--card-line);z-index:-1;}
.tl-step:first-child .tl-line{display:none;}
.tl-step.done .tl-line,.tl-step.active .tl-line{background:var(--text);}
.tl-label{font-size:12px;color:var(--text-soft);font-weight:600;}
.tl-step.active .tl-label{color:var(--accent);}
.team-list{display:flex;flex-direction:column;gap:14px;}
.team-member{display:flex;align-items:center;gap:12px;}
.team-member .name{font-weight:600;font-size:14.5px;}
.team-member .role{font-size:12.5px;color:var(--text-soft);}
.side-card{background:var(--card);border:1.5px solid var(--card-line);border-radius:var(--radius-m);padding:24px;margin-bottom:22px;}
.side-card h3{font-size:15px;margin-bottom:16px;}
.info-row{display:flex;justify-content:space-between;font-size:14.5px;padding:9px 0;border-bottom:1px solid var(--card-line);}
.info-row:last-child{border-bottom:none;}
.info-row span:first-child{color:var(--text-soft);}
.info-row span:last-child{font-weight:600;text-align:right;}
.cta-box{background:var(--accent);color:#fff;border-radius:var(--radius-m);padding:26px;text-align:center;}
.cta-box h3{font-size:19px;color:#fff;margin-bottom:14px;}
.cta-box .btn-secondary{border-color:#fff;color:#fff;width:100%;margin-top:10px;}
.cta-box .btn-secondary:hover{background:#fff;color:var(--accent);}
.cta-box .btn-primary{background:#fff;color:var(--accent);width:100%;}
.cta-box .btn-primary:hover{background:#f0f0f0;}
.btn-sm{padding:8px 14px;font-size:13px;}
.interest-card{border:1.5px solid var(--card-line);background:var(--card);border-radius:var(--radius-s);padding:16px;margin-bottom:12px;}
.interest-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.interest-who{display:flex;align-items:center;gap:10px;}
.interest-name{font-weight:700;font-size:14.5px;}
.interest-meta{font-size:12.5px;color:var(--text-soft);margin-top:2px;}
.interest-msg{font-size:14px;color:var(--text-soft);margin-top:10px;white-space:pre-line;}
.interest-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.modal-profile{display:flex;gap:12px;align-items:flex-start;background:var(--bg-alt);border-radius:var(--radius-s);padding:14px;margin-bottom:18px;}
.modal-profile .name{font-weight:700;font-size:14.5px;}
.modal-profile .bio{font-size:13px;color:var(--text-soft);margin-top:4px;}
.check-row{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-soft);margin-top:-6px;margin-bottom:16px;}
.check-row input{width:auto;}
@media(max-width:900px){.detail-layout{grid-template-columns:1fr;}}

/* ---------- Forms ---------- */
.form-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:52px;align-items:start;padding:50px 0 90px;}
.form-block{margin-bottom:36px;}
.form-block h2{font-size:19px;margin-bottom:6px;}
.form-block .hint{font-size:13.5px;color:var(--text-soft);margin-bottom:18px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:7px;}
.field input,.field textarea,.field select{
  width:100%;border:1.5px solid var(--card-line);background:var(--card);border-radius:var(--radius-s);
  padding:12px 14px;font-family:inherit;font-size:14.5px;color:var(--text);
}
.field textarea{min-height:96px;resize:vertical;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.preview-sticky{position:sticky;top:100px;}
.preview-label{font-size:12.5px;font-weight:700;color:var(--text-soft);margin-bottom:12px;text-transform:none;}
@media(max-width:900px){.form-layout{grid-template-columns:1fr;}.preview-sticky{position:static;order:-1;}}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(23,23,23,0.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--card);border-radius:var(--radius-m);padding:30px;max-width:460px;width:100%;}
.modal h3{font-size:20px;margin-bottom:6px;}
.modal .hint{font-size:13.5px;color:var(--text-soft);margin-bottom:18px;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}

/* ---------- Profile / Dashboard ---------- */
.profile-head{display:flex;gap:22px;align-items:center;padding:50px 0 20px;}
.profile-head .avatar{width:72px;height:72px;font-size:26px;}
.profile-stats{display:flex;gap:34px;margin-top:20px;flex-wrap:wrap;}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:26px;}
.stat span{font-size:13px;color:var(--text-soft);}
.tabs{display:flex;gap:8px;border-bottom:1.5px solid var(--card-line);margin:34px 0 30px;}
.tab{padding:12px 4px;margin-right:22px;font-size:14.5px;font-weight:600;color:var(--text-soft);border-bottom:2px solid transparent;cursor:pointer;background:none;border-top:none;border-left:none;border-right:none;}
.tab.active{color:var(--text);border-bottom-color:var(--accent);}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
@media(max-width:760px){.dash-grid{grid-template-columns:1fr;}}
.mini-list{display:flex;flex-direction:column;gap:10px;}
.mini-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--card);border:1.5px solid var(--card-line);border-radius:var(--radius-s);font-size:14px;}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border:1.3px solid var(--card-line);border-radius:20px;margin:3px 5px 0 0;background:var(--card);}

/* ---------- Footer ---------- */
.footer{border-top:1.5px solid var(--card-line);padding:44px 0;margin-top:20px;}
.footer-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
.footer-brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:15px;}
.footer p{font-size:13px;color:var(--text-soft);}

/* ---------- Misc ---------- */
.skeleton{color:var(--text-soft);padding:60px 0;text-align:center;font-size:14px;}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:14px 22px;border-radius:var(--radius-s);font-size:14px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,0.2);}
.filter-clear{font-size:13px;color:var(--accent);font-weight:600;background:none;border:none;padding:8px 4px;}
.login-inline{max-width:400px;margin:90px auto;background:var(--card);border:1.5px solid var(--card-line);border-radius:var(--radius-m);padding:34px;}
</style>
</head>

<div id="nav-root"></div>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

const SUPABASE_URL = 'https://fupknnhlakpvruzqvnrf.supabase.co';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let authReady = false; // flips true once the app's first load has finished

/* ---------- storage helpers ---------- */
async function storeGet(key, shared){
  try{ const r = await window.storage.get(key, shared); return r ? r.value : null; }
  catch(e){ return null; }
}
async function storeSet(key, value, shared){
  try{ await window.storage.set(key, value, shared); return true; }
  catch(e){ console.error('storage set failed', key, e); return false; }
}
async function storeList(prefix, shared){
  try{ const r = await window.storage.list(prefix, shared); return r ? r.keys : []; }
  catch(e){ return []; }
}
async function storeDelete(key, shared){
  try{ await window.storage.delete(key, shared); }catch(e){}
}

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,10); }

const COLORS = ['#20309B','#A8391A','#22622A','#7A5A00','#6A2E8F'];
function colorFor(str){
  let h=0; for(let i=0;i<str.length;i++) h = str.charCodeAt(i) + ((h<<5)-h);
  return COLORS[Math.abs(h)%COLORS.length];
}
function initials(name){
  return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('');
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- unit-aware formatting (hours / duration / team size) ---------- */
function formatHours(n){
  n = Number(n);
  if(!n || isNaN(n)) return 'Flexible';
  return n + ' hour' + (n===1?'':'s') + '/week';
}
function formatDuration(value, unit){
  value = Number(value);
  if(!value || isNaN(value)) return 'Flexible';
  const base = (unit==='month') ? 'month' : 'week';
  return value + ' ' + base + (value===1?'':'s');
}
function formatTeam(current, desired){

/* Turns a Supabase `profiles` row into the shape the rest of the app expects */
function mapProfileRow(row){
  return {
    id: row.id,
    name: row.display_name || 'ALROLY member',
    bio: row.bio || '',
    skills: (row.skills||'').split(',').map(s=>s.trim()).filter(Boolean),
    interests: (row.interests||'').split(',').map(s=>s.trim()).filter(Boolean)
  };
}

/* ---------- data load / seed ---------- */
async function loadAllData(){
  const userKeys = await storeList('users:', true);
  const projectKeys = await storeList('projects:', true);
  const interestKeys = await storeList('interests:', true);
  const reviewKeys = await storeList('reviews:', true);

  state.users = {};
  for(const k of userKeys){
    const v = await storeGet(k, true);
    if(v){ try{ const u = JSON.parse(v); state.users[u.id]=u; }catch(e){} }
  }
  state.projects = {};
  for(const k of projectKeys){
    const v = await storeGet(k, true);
    if(v){ try{ const p = JSON.parse(v); state.projects[p.id]=p; }catch(e){} }
  }
  state.interests = {};
  for(const k of interestKeys){
    const v = await storeGet(k, true);
    if(v){ try{ const it = JSON.parse(v); state.interests[it.id]=it; }catch(e){} }
  }
  state.reviews = {};
  for(const k of reviewKeys){
    const v = await storeGet(k, true);
    if(v){ try{ const r = JSON.parse(v); state.reviews[r.id]=r; }catch(e){} }
  }

  // Everyone's public profile info (name/skills/bio) comes from Supabase now,
  // so people can see each other across real accounts, not just their own browser.
  try{
    const { data: allProfiles, error } = await sb.from('profiles').select('*');
    if(!error && allProfiles){
      for(const row of allProfiles){ state.users[row.id] = mapProfileRow(row); }
    }
  }catch(e){ console.error('Failed to load profiles from Supabase', e); }

  const { data: sessionData } = await sb.auth.getSession();
  if(sessionData && sessionData.session && sessionData.session.user){
    await syncProfileForAuthUser(sessionData.session.user);
  }

  state.loaded = true;
}

/* Checks whether the signed-in Google account already has an ALROLY profile.
   If yes, log them in. If no, park them on the "complete your profile" screen. */
async function syncProfileForAuthUser(authUser){
  const { data: profile } = await sb.from('profiles').select('*').eq('id', authUser.id).maybeSingle();
  if(profile){
    state.users[profile.id] = mapProfileRow(profile);
    state.currentUserId = profile.id;
    state.pendingAuthUser = null;
  } else {
    state.pendingAuthUser = {
      id: authUser.id,
      email: authUser.email,
      name: (authUser.user_metadata && (authUser.user_metadata.full_name || authUser.user_metadata.name)) || ''
    };
    state.currentUserId = null;
  }
}

/* ---------- toast ---------- */
let toastTimer=null;
function showToast(msg, sub){
  const root = document.getElementById('toast-root');
  root.innerHTML = '<div class="toast">'+escapeHtml(msg)+(sub?'<div style="font-weight:500;opacity:.85;margin-top:4px;font-size:12.5px;">'+escapeHtml(sub)+'</div>':'')+'</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ root.innerHTML=''; }, sub?4200:2800);
}

/* ---------- modal ---------- */
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function getUserInterestForProject(userId, projectId){
  // most recent interest by this user for this project (so re-applying after a decline works)
  const list = Object.values(state.interests).filter(i=>i.projectId===projectId && i.userId===userId);
  list.sort((a,b)=>b.createdAt-a.createdAt);
  return list[0] || null;
}
function isTeamFull(p){ return (Number(p.teamSize)||0) >= (Number(p.desiredTeam)||0); }

/* A full team stops recruiting and moves the project to Building automatically.
   It never auto-advances to Completed — only the creator can do that. */
function syncProjectStatus(p){
  if(p.status==='Recruiting' && isTeamFull(p)){
    p.status = 'Building';
  }
  return p;
}

async function sendInterest(projectId){
  const user = currentUser();
  if(!user) return;
  const msg = document.getElementById('join-message').value.trim();
  const anonymous = document.getElementById('join-anonymous').checked;
  const it = {
    id: uid('int'), projectId, userId: user.id, message: msg, anonymous,
    status:'pending', createdAt: Date.now()
  };
  state.interests[it.id] = it;
  await storeSet('interests:'+it.id, JSON.stringify(it), true);
  closeModal();
  showToast('Interest sent!', 'The project creator can now review your profile and interest.');
  render();
}

async function acceptInterest(interestId){
  const it = state.interests[interestId];
  if(!it) return;
  const p = state.projects[it.projectId];
  if(!p) return;
  const user = currentUser();
  if(!user || user.id !== p.creatorId){ showToast('Only the project creator can accept interests.'); return; }
  if(isTeamFull(p)){ showToast('This team is already full.'); return; }
  if(!p.members.includes(it.userId)) p.members.push(it.userId);
  p.teamSize = p.members.length;
  syncProjectStatus(p);
  it.status = 'accepted';
  await storeSet('projects:'+p.id, JSON.stringify(p), true);
  await storeSet('interests:'+it.id, JSON.stringify(it), true);
  showToast(isTeamFull(p) ? 'Team full — project moved to Building.' : 'Added to the team.');
  render();
}
async function declineInterest(interestId){
  const it = state.interests[interestId];
  if(!it) return;
  const p = state.projects[it.projectId];
  const user = currentUser();
  if(!p || !user || user.id !== p.creatorId){ showToast('Only the project creator can decline interests.'); return; }
  it.status = 'declined';
  await storeSet('interests:'+it.id, JSON.stringify(it), true);
  showToast('Interest declined.');
  render();
}

function openCompleteConfirm(projectId){
  const p = state.projects[projectId];

  if(!p || !user || user.id !== p.creatorId) return;
  const root = document.getElementById('modal-root');

async function confirmComplete(projectId){
  const p = state.projects[projectId];
  const user = currentUser();
  if(!p || !user || user.id !== p.creatorId) return;
  p.status = 'Completed';
  await storeSet('projects:'+p.id, JSON.stringify(p), true);
  closeModal();
  showToast('Project marked as completed.');
  render();
}

/* ---------- Collaboration reviews (structure only, for post-completion feedback) ---------- */
function getReviewFrom(projectId, byUserId, aboutUserId){
  return Object.values(state.reviews).find(r=>r.projectId===projectId && r.byUserId===byUserId && r.aboutUserId===aboutUserId) || null;
}
async function submitReview(projectId, aboutUserId, wouldWorkAgain){
  const user = currentUser();
  if(!user) return;
  const existing = getReviewFrom(projectId, user.id, aboutUserId);
  const r = existing || {id: uid('rev'), projectId, byUserId:user.id, aboutUserId, createdAt: Date.now()};
  r.wouldWorkAgain = wouldWorkAgain; // 'yes' | 'maybe' | 'no'
  r.feedback = (document.getElementById('review-feedback-'+aboutUserId)?.value || r.feedback || '').trim();
  state.reviews[r.id] = r;
  await storeSet('reviews:'+r.id, JSON.stringify(r), true);
  showToast('Thanks for the feedback.');
  render();
}

function matchesFilters(p){
  // Completed projects stay out of the default active feed — they only show up if
  // someone explicitly filters for "Completed" (acts as a lightweight archive view).
  if(!filters.status && p.status==='Completed') return false;
  if(filters.category && p.category!==filters.category) return false;
  if(filters.skill && !p.skills.includes(filters.skill)) return false;
  if(filters.status && p.status!==filters.status) return false;
  if(filters.q){
    const q = filters.q.toLowerCase();
    const hay = (p.title+' '+p.shortDesc+' '+p.skills.join(' ')).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function fillProjectsGrid(){
  const grid = document.getElementById('projects-grid');
  const count = document.getElementById('results-count');
  if(!grid) return;
  const list = Object.values(state.projects).filter(matchesFilters).sort((a,b)=>b.createdAt-a.createdAt);
  if(count) count.textContent = list.length + (list.length===1?' project found':' projects found');
  if(list.length===0){
    grid.outerHTML = `<div id="projects-grid" class="empty-state">
      <h3>There are roads to be built.</h3>
      <p>Be the first person to put an idea on the map.</p>
      <a href="#/create-project" class="btn btn-primary">Start a project</a>
    </div>`;
    return;
  }
  grid.innerHTML = list.map(projectCardHtml).join('');
}

function applyFilters(){
  filters.category = document.getElementById('f-category')?.value || '';
  filters.skill = document.getElementById('f-skill')?.value || '';
  filters.status = document.getElementById('f-status')?.value || '';
  filters.q = document.getElementById('f-q')?.value || '';
  fillProjectsGrid();
}
function clearFilters(){
  filters = {category:'',skill:'',status:'',duration:'',q:''};
  render();
}

        <h2>The problem</h2>

                <option value="week" ${d.durationUnit==='week'?'selected':''}>Weeks</option>

function updateDraft(){
  const d = draftProject;
  d.title = document.getElementById('d-title').value;
  d.shortDesc = document.getElementById('d-shortdesc').value;
  d.category = document.getElementById('d-category').value;
  d.fullDesc = document.getElementById('d-fulldesc').value;
  d.problem = document.getElementById('d-problem').value;
  d.skillsRaw = document.getElementById('d-skills').value;
  d.desiredTeam = parseInt(document.getElementById('d-team').value)||1;
  d.durationValue = document.getElementById('d-duration-value').value;
  d.durationUnit = document.getElementById('d-duration-unit').value;
  d.hoursPerWeek = document.getElementById('d-hours').value;
  d.deadline = document.getElementById('d-deadline').value;
  renderRolesEditor();
  renderLivePreview();
}
function renderRolesEditor(){
  const el = document.getElementById('roles-editor');
  if(!el) return;
  el.innerHTML = draftProject.roles.map((r,i)=>`
    <div class="field-row" style="margin-bottom:8px;">
      <input placeholder="Role title" value="${escapeHtml(r.title)}" oninput="draftProject.roles[${i}].title=this.value; renderLivePreview()" />
      <input placeholder="Hours/week" value="${escapeHtml(r.hours)}" oninput="draftProject.roles[${i}].hours=this.value; renderLivePreview()" />
    </div>`).join('');
}
function addRole(){
  draftProject.roles.push({title:'',hours:''});
  renderRolesEditor();
}
function renderLivePreview(){
  const el = document.getElementById('live-preview');
  if(!el) return;
  const d = draftProject;
  const skills = d.skillsRaw.split(',').map(s=>s.trim()).filter(Boolean);
  const fake = {
    category: d.category||'Technology',
    status:'Recruiting',
    title: d.title || 'Your project title',
    shortDesc: d.shortDesc || 'A one-line description of what you\'re building will show up here.',
    skills: skills.length?skills:['Skills'],
    teamSize:1, desiredTeam:d.desiredTeam||4,
    duration: d.durationValue ? formatDuration(d.durationValue, d.durationUnit) : 'Duration',
    hours: d.hoursPerWeek ? formatHours(d.hoursPerWeek) : 'Hours/week'
  };
  el.innerHTML = `
  <div class="pcard-top" style="display:none"></div>
  <div class="pcard" style="cursor:default;">
    <div class="pcard-top">
      <span class="pcard-cat">${escapeHtml(fake.category)}</span>
      <span class="status-pill status-Recruiting">RECRUITING</span>
    </div>
    <h3>${escapeHtml(fake.title)}</h3>
    <p class="pcard-desc">${escapeHtml(fake.shortDesc)}</p>
    <p class="pcard-skills">${fake.skills.map(escapeHtml).join(' · ')}</p>
    <div class="pcard-meta">
      <span><b>${fake.teamSize} / ${fake.desiredTeam}</b> people</span>
      <span><b>${escapeHtml(fake.duration)}</b></span>
      <span><b>${escapeHtml(fake.hours)}</b></span>
    </div>
  </div>`;
}

async function submitProject(){
  const d = draftProject;
  const user = currentUser();
  if(!user) return;
  if(!d.title.trim() || !d.shortDesc.trim()){
    showToast('Give your project a title and short description first.');
    return;
  }
  const skills = d.skillsRaw.split(',').map(s=>s.trim()).filter(Boolean);
  const roles = d.roles.filter(r=>r.title.trim());
  const p = {
    id: uid('p'), title:d.title.trim(), shortDesc:d.shortDesc.trim(), category:d.category,
    fullDesc: d.fullDesc.trim() || d.shortDesc.trim(),
    problem: d.problem.trim() || 'Not specified yet.',
    skills: skills.length?skills:['General'],
    teamSize:1, desiredTeam: d.desiredTeam||4,
    durationValue: parseInt(d.durationValue)||1, durationUnit: d.durationUnit||'week',
    hoursPerWeek: parseInt(d.hoursPerWeek)||1,
    status:'Recruiting',
    creatorId:user.id, members:[user.id],
    roles: roles.length?roles:[{title:'Contributor',hours:'Flexible'}],
    deadline: d.deadline.trim()||'Rolling', createdAt: Date.now()
  };
  syncProjectStatus(p);
  state.projects[p.id] = p;
  await storeSet('projects:'+p.id, JSON.stringify(p), true);
  draftProject = null;
  showToast('Your project is live.');
  route('#/project/'+p.id);
}

      <div class="field"><label>Short bio</label><textarea id="ob-bio" placeholder="A sentence or two about you"></textarea></div>
      <div class="field"><label>Skills (comma separated)</label><input id="ob-skills" placeholder="e.g. Python, UX Design" /></div>
      <div class="field"><label>Interests (comma separated)</label><input id="ob-interests" placeholder="e.g. Healthcare, Education" /></div>
      <button class="btn btn-primary btn-block" onclick="completeOnboarding()">Save and continue</button>
      <p style="font-size:12px;color:var(--text-soft);margin-top:14px;">You can change any of this later from your profile.</p>
    </div>
  </div>`;
}
async function completeOnboarding(){
  const p = state.pendingAuthUser;
  if(!p) return;
  const name = document.getElementById('ob-name').value.trim() || 'ALROLY member';
  const bio = document.getElementById('ob-bio').value.trim();
  const skillsRaw = document.getElementById('ob-skills').value.trim();
  const interestsRaw = document.getElementById('ob-interests').value.trim();
  try{
    const { error } = await sb.from('profiles').insert({
      id: p.id, display_name: name, bio, skills: skillsRaw, interests: interestsRaw
    });
    if(error) throw error;
  }catch(e){
    console.error(e);
    showToast('Could not save your profile — please try again.');
    return;
  }
  state.users[p.id] = {
    id: p.id, name, bio,
    skills: skillsRaw.split(',').map(s=>s.trim()).filter(Boolean),
    interests: interestsRaw.split(',').map(s=>s.trim()).filter(Boolean)
  };
  state.currentUserId = p.id;
  state.pendingAuthUser = null;
  route('#/');
  showToast('Welcome to ALROLY, '+name+'!');
}

/* ---------- Profile ---------- */
function renderProfile(){
  if(!requireLogin('#/profile')) return `<div class="container skeleton">Redirecting to log in...</div>`;
  const user = currentUser();
  const created = Object.values(state.projects).filter(p=>p.creatorId===user.id);
  const joined = Object.values(state.projects).filter(p=>p.members.includes(user.id) && p.creatorId!==user.id);
  const completed = Object.values(state.projects).filter(p=>p.members.includes(user.id) && p.status==='Completed');
  return `
  <div class="container">
    <div class="profile-head" style="justify-content:space-between;">
      <div style="display:flex;gap:22px;align-items:center;">
        <div class="avatar" style="background:${colorFor(user.name)}">${initials(user.name)}</div>
        <div>
          <h1 style="font-size:26px;">${escapeHtml(user.name)}</h1>
          <p style="color:var(--text-soft);font-size:14.5px;margin-top:4px;">${escapeHtml(user.bio)||'No bio yet.'}</p>
        </div>
      </div>
      <a href="#/login" class="btn btn-secondary btn-sm">Switch account</a>
    </div>
    <div class="profile-stats">
      <div class="stat"><b>${created.length}</b><span>Projects created</span></div>
      <div class="stat"><b>${joined.length}</b><span>Projects joined</span></div>
      <div class="stat"><b>${completed.length}</b><span>Completed</span></div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchProfileTab('about', this)">About</button>
      <button class="tab" onclick="switchProfileTab('projects', this)">Projects</button>
    </div>
    <div id="profile-tab-content"></div>
  </div>`;
}
function switchProfileTab(tab, btn){
  document.querySelectorAll('.tabs .tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const user = currentUser();
  const el = document.getElementById('profile-tab-content');
  if(tab==='about'){
    el.innerHTML = `
      <div class="form-block" style="max-width:520px;">
        <div class="field"><label>Bio</label><textarea id="p-bio" oninput="autosaveProfile()">${escapeHtml(user.bio)}</textarea></div>
        <div class="field"><label>Skills (comma separated)</label><input id="p-skills" value="${escapeHtml((user.skills||[]).join(', '))}" oninput="autosaveProfile()" /></div>
        <div class="field"><label>Interests (comma separated)</label><input id="p-interests" value="${escapeHtml((user.interests||[]).join(', '))}" oninput="autosaveProfile()" /></div>
        <p style="font-size:12.5px;color:var(--text-soft);">Saved automatically.</p>
      </div>`;
  } else {
    const created = Object.values(state.projects).filter(p=>p.creatorId===user.id);
    const joined = Object.values(state.projects).filter(p=>p.members.includes(user.id) && p.creatorId!==user.id);
    el.innerHTML = `
      <h3 style="font-size:15px;margin-bottom:14px;">Created</h3>
      <div class="project-grid" style="margin-bottom:36px;">${created.map(projectCardHtml).join('') || '<p style="color:var(--text-soft);font-size:14px;">Nothing yet.</p>'}</div>
      <h3 style="font-size:15px;margin-bottom:14px;">Joined</h3>
      <div class="project-grid">${joined.map(projectCardHtml).join('') || '<p style="color:var(--text-soft);font-size:14px;">Nothing yet.</p>'}</div>
    `;
  }
}
let profileSaveTimer=null;
function autosaveProfile(){
  clearTimeout(profileSaveTimer);
  profileSaveTimer = setTimeout(async ()=>{
    const user = currentUser();
    if(!user) return;
    user.bio = document.getElementById('p-bio').value;
    user.skills = document.getElementById('p-skills').value.split(',').map(s=>s.trim()).filter(Boolean);
    user.interests = document.getElementById('p-interests').value.split(',').map(s=>s.trim()).filter(Boolean);
    try{
      const { error } = await sb.from('profiles').update({
        bio: user.bio,
        skills: user.skills.join(', '),
        interests: user.interests.join(', ')
      }).eq('id', user.id);
      if(error) throw error;
      showToast('Profile saved.');
    }catch(e){
      console.error(e);
      showToast('Could not save — check your connection and try again.');
    }
  }, 500);
}

/* ---------- Dashboard ---------- */
function renderDashboard(){
  if(!requireLogin('#/dashboard')) return `<div class="container skeleton">Redirecting to log in...</div>`;
  const user = currentUser();
  const myProjects = Object.values(state.projects).filter(p=>p.creatorId===user.id);
  const joining = Object.values(state.projects).filter(p=>p.members.includes(user.id) && p.creatorId!==user.id);
  const sent = Object.values(state.interests).filter(i=>i.userId===user.id);
  const received = Object.values(state.interests).filter(i=> myProjects.some(p=>p.id===i.projectId));

  return `
  <div class="container">
    <div class="section-head" style="margin-top:44px;">
      <h2>Your dashboard</h2>
      <p>Everything you're building, joining, and asking about, in one place.</p>
    </div>
    <div class="dash-grid">
      <div>
        <h3 style="font-size:15px;margin-bottom:12px;">My projects</h3>
        <div class="mini-list">
          ${myProjects.map(p=>`<div class="mini-row"><span>${escapeHtml(p.title)}</span><a href="#/project/${p.id}" class="link" style="color:var(--accent);font-weight:600;">View &rarr;</a></div>`).join('') ||
            `<div class="empty-state"><h3 style="font-size:18px;">There are roads to be built.</h3><p>Be the first person to put an idea on the map.</p><a href="#/create-project" class="btn btn-primary">Start a project</a></div>`}
        </div>
      </div>
      <div>
        <h3 style="font-size:15px;margin-bottom:12px;">Projects I'm joining</h3>
        <div class="mini-list">
          ${joining.map(p=>`<div class="mini-row"><span>${escapeHtml(p.title)}</span><a href="#/project/${p.id}" class="link" style="color:var(--accent);font-weight:600;">View &rarr;</a></div>`).join('') ||
            `<div class="empty-state"><h3 style="font-size:18px;">You haven't found your road yet.</h3><p></p><a href="#/projects" class="btn btn-primary">Explore projects</a></div>`}
        </div>
      </div>
      <div>
        <h3 style="font-size:15px;margin-bottom:12px;">Interests you've sent</h3>
        <div class="mini-list">
          ${sent.map(i=>{const p=state.projects[i.projectId]; return p?`<div class="mini-row"><span>${escapeHtml(p.title)}</span><span class="tag">${escapeHtml(i.status)}</span></div>`:'';}).join('') ||
            `<p style="color:var(--text-soft);font-size:14px;">No interests sent yet.</p>`}
        </div>
      </div>
      <div>
        <h3 style="font-size:15px;margin-bottom:12px;">Interests received</h3>
        <div>
          ${received.length ? received.map(i=>renderInterestCard(i,{showProjectName:true})).join('') :
            `<p style="color:var(--text-soft);font-size:14px;">No interest yet &mdash; share your project to get things moving.</p>`}
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- Footer ---------- */
function renderFooter(){
  return `
  <footer class="footer">
    <div class="container footer-inner">
      <span class="footer-brand">ALL ROADS LEAD TO YOU</span>
      <p>Every idea leads somewhere. Every idea leads to someone.</p>
    </div>
  </footer>`;
}

function renderPublicProfile(id){
  const user = state.users[id];
  if(!user) return `<div class="container skeleton">This profile doesn't exist (or hasn't loaded yet).</div>`;
  const isSelf = currentUser() && currentUser().id === id;
  const created = Object.values(state.projects).filter(p=>p.creatorId===user.id);
  const joined = Object.values(state.projects).filter(p=>p.members.includes(user.id) && p.creatorId!==user.id);
  const completed = Object.values(state.projects).filter(p=>p.members.includes(user.id) && p.status==='Completed');
  return `
  <div class="container">
    <p class="detail-crumb" style="margin-top:40px;"><a href="#/projects">&larr; All projects</a></p>
    <div class="profile-head" style="padding-top:14px;">
      <div class="avatar" style="background:${colorFor(user.name)}">${initials(user.name)}</div>
      <div>
        <h1 style="font-size:26px;">${escapeHtml(user.name)}${isSelf?' (you)':''}</h1>
        <p style="color:var(--text-soft);font-size:14.5px;margin-top:4px;">${escapeHtml(user.bio)||'No bio yet.'}</p>
        <div>${(user.skills||[]).map(s=>`<span class="tag">${escapeHtml(s)}</span>`).join('') || ''}</div>
      </div>
    </div>
    <div class="profile-stats">
      <div class="stat"><b>${created.length}</b><span>Projects created</span></div>
      <div class="stat"><b>${joined.length}</b><span>Projects joined</span></div>
      <div class="stat"><b>${completed.length}</b><span>Completed</span></div>
    </div>
    <h3 style="font-size:15px;margin:34px 0 14px;">Projects</h3>
    <div class="project-grid">${[...created, ...joined].map(projectCardHtml).join('') || '<p style="color:var(--text-soft);font-size:14px;">No projects yet.</p>'}</div>
  </div>`;
}

/* ---------- Router ---------- */
function route(hash){
  if(location.hash === hash){ render(); }
  else { location.hash = hash; }
}
window.addEventListener('hashchange', render);

function render(){
  document.getElementById('mobile-menu')?.classList.remove('open');
  renderNav();
  const app = document.getElementById('app');

  // Signed in with Google but no ALROLY profile yet — finish that first, on every route.
  if(state.pendingAuthUser){
    app.innerHTML = renderOnboarding() + renderFooter();
    window.scrollTo(0,0);
    return;
  }

  const hash = location.hash || '#/';
  const [path, query] = hash.split('?');
  const parts = path.replace('#/','').split('/').filter(Boolean);

  let html = '';
  if(parts.length===0){
    html = renderLanding();
  } else if(parts[0]==='projects'){
    html = renderProjects();
  } else if(parts[0]==='project' && parts[1]){
    html = renderProjectDetail(parts[1]);
  } else if(parts[0]==='user' && parts[1]){
    html = renderPublicProfile(parts[1]);
  } else if(parts[0]==='create-project'){
    html = renderCreateProject();
  } else if(parts[0]==='how-it-works'){
    html = renderHowItWorks();
  } else if(parts[0]==='profile'){
    html = renderProfile();
  } else if(parts[0]==='dashboard'){
    html = renderDashboard();
  } else if(parts[0]==='login'){
    html = renderLogin();
  } else {
    html = `<div class="container skeleton">Page not found. <a href="#/" style="color:var(--accent)">Go home</a></div>`;
  }
  app.innerHTML = html + renderFooter();
  window.scrollTo(0,0);

  if(parts.length===0) fillLandingProjects();
  if(parts[0]==='projects') fillProjectsGrid();
  if(parts[0]==='create-project' && currentUser()){ renderRolesEditor(); renderLivePreview(); }
  if(parts[0]==='profile' && currentUser()){ switchProfileTab('about', document.querySelector('.tabs .tab')); }
}

/* ---------- Boot ---------- */
async function boot(){
  document.getElementById('app').innerHTML = `<div class="container skeleton">Loading roads…</div>`;

  // If Google just redirected back here, the URL may briefly contain auth tokens
  // in the hash. Our own router uses the hash for navigation too, so once Supabase
  // has had a chance to read it, we clear it back to a clean "#/".
  const rawHash = window.location.hash || '';
  const looksLikeAuthRedirect = rawHash.includes('access_token') || rawHash.includes('error_description');

  await seedIfNeeded();
  await loadAllData();

  if(looksLikeAuthRedirect){
    history.replaceState(null, '', window.location.pathname + window.location.search + '#/');
  }

  render();
  authReady = true;

  // Keep the app in sync if someone signs in or out (including finishing the
  // Google redirect, or switching accounts in another tab).
  sb.auth.onAuthStateChange(async (event, session) => {
    if(event === 'SIGNED_IN' && session && session.user){
      await syncProfileForAuthUser(session.user);
      if(authReady){ route('#/'); }
      render();
    } else if(event === 'SIGNED_OUT'){
      state.currentUserId = null;
      state.pendingAuthUser = null;
      render();
    }
  });
}
boot();
</script>
